    <!--
      Fonts were being pulled in with an @import at the top of index.css, which
      the browser can only discover after the stylesheet itself has downloaded.
      Linking them here (behind a preconnect) starts the fetch during the
      initial HTML parse instead.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Outfit:wght@400;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Outfit:wght@400;700&display=swap"
      />
    </noscript>

    <!--
      The Python runtime (several MB of WebAssembly) is no longer loaded here.
      src/utils/pyodide.ts fetches it the first time a lesson, the sandbox or
      the visualiser actually needs to run code, so pages that never execute
      Python do not pay for it.
    -->
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />

    <script>
      // Fix for "Cannot set property fetch of #<Window> which has only a getter"
      try {
        const originalFetch = window.fetch;
        Object.defineProperty(window, 'fetch', {
          configurable: true,
          enumerable: true,
          get: () => originalFetch,
          set: (v) => {
            console.warn('Attempted to overwrite window.fetch with:', v);
          }
        });
      } catch (e) {
        console.error('Failed to make fetch configurable:', e);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
